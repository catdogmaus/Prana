name: Update Release Notes & Manifest

on:
  release:
    types: [published]

jobs:
  update-release-and-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Step 1: Checkout the repo code
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Step 2: Update manifest.json version
      - name: Update manifest.json version
        run: |
          # 1. Get the tag name (e.g., v1.2.0)
          RAW_TAG="${{ github.event.release.tag_name }}"
          
          # 2. Strip leading 'v' AND leading '.' if present
          # ${RAW_TAG#v} removes 'v', then ${...#.} removes a leading dot
          VERSION="${RAW_TAG#v}"
          VERSION="${VERSION#.}"
          
          echo "Setting version to: $VERSION"

          MANIFEST_PATH="custom_components/prana/manifest.json"

          # 3. Update version key in manifest.json
          jq --arg v "$VERSION" '.version = $v' "$MANIFEST_PATH" > tmp.json && mv tmp.json "$MANIFEST_PATH"

          # 4. Configure git bot
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 5. Commit and re-tag
          if ! git diff --quiet "$MANIFEST_PATH"; then
            git add "$MANIFEST_PATH"
            git commit -m "bump: manifest version to $VERSION [skip ci]"
            git push origin HEAD:main

            # Force the tag to point to this new commit
            git tag -f "$RAW_TAG"
            git push origin "$RAW_TAG" --force
          fi

      # Step 3: Existing step to prepend badges to the release body
      - name: Prepend Badges to Release Body
        uses: actions/github-script@v8
        with:
          script: |
            const badges = `[![GitHub License](https://img.shields.io/github/license/catdogmaus/Prana?color=green)](https://github.com/catdogmaus/Prana/blob/main/LICENSE)  [![](https://img.shields.io/github/release/catdogmaus/Prana/all.svg)](https://github.com/catdogmaus/Prana/releases) [![hacs_badge](https://img.shields.io/badge/HACS-Custom-41BDF5.svg)](https://github.com/hacs/integration)<br/><span class="badge-buymeacoffee"><a href="https://ko-fi.com/catdog58928" title="Support this project using Ko-Fi"><img src="https://img.shields.io/badge/Buy_me_coffee_or_biscuits-support-yellow.svg?style=for-the-badge&logo=kofi" alt="Buy Me A Coffee  button" /></a></span><br/>\n\n`;

            const currentBody = context.payload.release.body || '';

            // Prevent duplicating badges if the release is published/edited again
            if (!currentBody.includes('catdog58928')) {
              const newBody = badges + currentBody;
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: context.payload.release.id,
                body: newBody
              });
            }
